# 週に1回、本物の裁判所サイトから数件だけ取得して、解析できるかを確かめる。
# サイトの構成が変わって壊れたときに、このワークフローの失敗で気づけるようにする。
name: Live check

on:
  schedule:
    - cron: '17 3 * * 1' # 毎週月曜 12:17（日本時間）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
