name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Claudeデスクトップ版向けの配布ファイル（.mcpb）を作れて、単体で動くことも確かめる
      - run: npm run pack:mcpb
      - run: npm run smoke:mcpb
